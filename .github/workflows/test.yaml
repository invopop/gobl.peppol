name: Test Go
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The three most recent Go releases, matching core GOBL. The oldest
        # matches the go directive in go.mod, and 1.27 is the first release to
        # enable the jsonv2 implementation of encoding/json by default.
        go-version: ["1.25.x", "1.26.x", "1.27.x"]
        include:
          - go-version: "1.27.x"
            coverage: true

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Run on the toolchain the matrix installed instead of downloading a
      # newer one when a module in the graph asks for it.
      GOTOOLCHAIN: local
      PHORM_URL: http://localhost:8080

    # phorm bundles the phive rule engine and serves the PINT A-NZ schematron
    # over HTTP, so the -validate test run can validate the fixtures.
    services:
      phorm:
        image: phelger/phorm:latest
        ports:
          - 8080:8080

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Dependencies
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      - name: Wait for phorm
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -H "X-Token: phorm-dev-token" \
              "${PHORM_URL}/api/get/vesids?include-deprecated=true" >/dev/null 2>&1; then
              echo "phorm ready"
              exit 0
            fi
            sleep 5
          done
          echo "phorm did not become ready in time" >&2
          exit 1

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      # Only the ubl package defines -validate, so the schematron run is a
      # separate pass scoped to it.
      - name: Schematron
        run: go test -count=1 ./ubl/ -args -validate=true

      - name: Coverage summary
        if: matrix.coverage
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      # Runs once the repo is enabled on Codecov and a CODECOV_TOKEN secret is
      # added; skipped (keeping the build green) until then.
      - name: Upload coverage reports to Codecov
        if: matrix.coverage && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: invopop/gobl.peppol
